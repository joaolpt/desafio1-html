<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Clínica Médica</title>
    <link rel="stylesheet" href="base.css">
</head>

<body>
    <div class="wrapper">
        <nav class="menu">
            <details>
                <summary>Menu</summary>
                <ul>
                    <li><a href="index.html">Página Principal</a></li>
                    <li><a href="sobreclinica.html">Sobre a Clínica</a></li>
                    <li><a href="atendimento.html">Horários de Atendimento</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </details>
        </nav>

        <main class="main">
            <header class="header">
                <img src="assets/img4.png" alt="Ícone de contato e atendimento" width="100">
            </header>

            <section class="content">
                <h1>Contatos</h1>

                <address>
                    <p>Telefone e WhatsApp: <a href="tel:99999999999">(99) 99999-9999</a></p>
                    <p>Endereço: Rua Inexistente, 87</p>
                </address>

                <!-- Adicionado 'title' para acessibilidade do leitor de tela -->
                <iframe title="Mapa de localização da clínica no Google Maps"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5376.404897072895!2d-42.514090941798365!3d-17.66472374843857!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xb28064d85912d1%3A0x27e3fe62f28c1fbc!2sR.%20Inexistente%2C%20Capelinha%20-%20MG%2C%2039680-000!5e0!3m2!1spt-BR!2sbr!4v1789737899744!5m2!1spt-BR!2sbr"
                    width="200" height="200" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

                <!-- Envelopamento obrigatório com <form> -->
                <form action="#" method="POST">
                    <fieldset>
                        <legend>Informações para contato</legend>
                        <div class="row">
                            <!-- Conexão for="" e id="" aplicada. Atributos name="" inseridos. -->
                            <label for="nome">Nome:</label>
                            <input type="text" id="nome" name="nome" required>

                            <label for="email">E-mail:</label>
                            <input type="email" id="email" name="email" required>

                            <label for="assunto">Assunto:</label>
                            <input type="text" id="assunto" name="assunto" required>

                            <label for="mensagem">Mensagem:</label>
                            <textarea id="mensagem" name="mensagem" placeholder="Digite aqui..." required></textarea>

                            <!-- type="reset" limpa o <form> inteiro; type="submit" envia -->
                            <button type="reset">Limpar</button>
                            <button type="submit">Enviar</button>
                        </div>
                    </fieldset>
                </form>
            </section>

            <footer class="footer">
                <h2>Informações de Contato</h2>
                <address>
                    <p>Telefone: <a href="tel:99999999999">(99) 99999-9999</a></p>
                    <p>E-mail: <a href="mailto:clinica@email.com">clinica@email.com</a></p>
                </address>
            </footer>
        </main>
    </div>
</body>

</html>
